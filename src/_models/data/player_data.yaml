kari:
  name: Kari
  bio: >
    Kari Noelle is an improviser and Meisner trained actor with experience in films, indie content, and live 
    performances. She studied and performed at Leela and Endgames Improv, and learned under a variety of coaches 
    from BATs, UCB and Second City. She’s collaborated and produced with diverse teams in the Bay Area, and you 
    can see more of her work on the web. Just google her! Kari has other hobbies too, but she is mostly having 
    a blast with All Out Comedy's Main Stage and her indie team Juicy Fruits.
  image: kari.jpg
  theaters:
    - all_out
    - provocation
    - endgames
  improv_since: 2013
  location: East Bay
  home_town: Fairfax Station
  social:
    instagram: kari.noelle.actor
    web: https://www.karinoelle.com

mary:
  name: Mary
  image: mary_matabor.png
  location: Oakland
  home_town: Campbell, CA
  improv_since: 2008
  theaters:
    - all_out
    - provocation
    - '2727'
    - matabor
    - sacramento_comedy_spot
  social:
    instagram: [marymatabor, chickflickimprov]
  bio: >
    Mary Matabor got her improv start with Pan Theater’s Awkward Face and has dabbled with an array of troupes 
    and side projects ever since. She has not yet quit improv, it’s just been lazily on her to-do list. Chick Flick, 
    which she co-founded, is a true love so that makes it hard. She also likes Puppet Party pretty good. Ms. Matabor 
    has mc'd and performed with troupes Ragged Wing, Wondertown and Puppette Party, among others, at assorted 
    festivals for the snacks, and is formerly of the main stage troupe at All Out Comedy Theater. She contains a 
    deep and abiding desire not to engage with people, which she undermines monthly by inventing entire 
    relationships — marriages, rivalries, decades of unresolved tension — with strangers, from scratch, on a spotlit 
    stage. She will vacate the theater immediately after the show ends.

